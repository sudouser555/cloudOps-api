
name: cloudops

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudops-api:compose
    environment:
      APP_VERSION: "1.0.0-compose"
      APP_ENV: "development"
    expose:
      - "8000"
    networks:
      - cloudops-network
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/cloudops
    depends_on:
      - api
    networks:
      - cloudops-network
    restart: unless-stopped

networks:
  cloudops-network:
    driver: bridge

volumes:
  nginx-logs:
